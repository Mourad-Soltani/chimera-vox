[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chimera-vox"
version = "0.1.2"
description = "Forge videos from a single photo and a script — free-tier pipeline"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Mourad Soltani", email = "mourad@aetherforge.dev" }]
keywords = ["video", "ai", "image-to-video", "free-tier", "zerogpu", "edge-tts"]

dependencies = [
    "edge-tts>=6.1.0",
    "gradio-client>=1.0.0",
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
]

[project.scripts]
chimera-vox = "chimera_vox.cli:app"

[tool.setuptools.packages.find]
include = ["chimera_vox*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
