name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q chimera_vox tests

      - name: Import check
        run: |
          python -c "
          import importlib
          mods = [
              'chimera_vox', 'chimera_vox.cli', 'chimera_vox.config',
              'chimera_vox.providers.registry', 'chimera_vox.stages.script_parser',
              'chimera_vox.stages.stitcher', 'chimera_vox.pipeline',
          ]
          for m in mods:
              importlib.import_module(m)
          print('imports OK')
          "

      - name: Unit tests
        run: pytest -v --tb=short -q
